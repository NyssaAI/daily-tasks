[project]
name = "daily-tasks"
version = "0.9.3"
description = "Daily Tasks planning session MCP server domain models"
readme = "README.md"
license = "LicenseRef-PolyForm-Small-Business-1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "nyssa-ai-logging",
    "nyssa-ai-configuration",
    "nyssa-ai-result",
    "langchain-core",
]

[project.scripts]
daily-tasks-mcp = "daily_tasks.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_tasks"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "test/unit/daily_tasks"]
include = ["src/daily_tasks/**/*.py", "test/**/*.py"]
cache-dir = ".temp/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["daily_tasks"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["daily_tasks"]
plugins = ["pydantic.mypy"]
cache_dir = ".temp/mypy"
