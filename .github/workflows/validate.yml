name: Validate standalone plugin and MCP server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python scripts/assemble.py check
      - run: uv run python scripts/assemble.py write
      - run: uv run python scripts/assemble.py check
      - run: uv run python scripts/validate.py
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run mypy --platform win32
      - run: uv run pytest
      - run: uv run python evals/report.py check
