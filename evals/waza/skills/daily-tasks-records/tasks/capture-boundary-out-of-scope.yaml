id: daily-tasks-records-capture-boundary-out-of-scope
name: Do not route candidate extraction from notes to records
description: Extracting candidates and asking for acceptance belongs to capture, not direct record creation.
tags:
  - trigger
  - negative
inputs:
  prompt: "Read through these meeting notes, extract possible commitments as candidates, and ask me to accept any before creating them."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: records-candidate-extraction-negative
    config:
      skill_path: skills/daily-tasks-records/SKILL.md
      mode: negative
