name: daily-tasks-plan-eval
description: Fast local trigger checks for selecting daily work.
skill: daily-tasks-plan
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 10
  parallel: false
  executor: mock
  model: mock
metrics:
  - name: trigger_quality
    weight: 1.0
    threshold: 1.0
    description: Does daily planning match requests to review and choose work without matching unrelated route planning?
tasks:
  - "tasks/*.yaml"
