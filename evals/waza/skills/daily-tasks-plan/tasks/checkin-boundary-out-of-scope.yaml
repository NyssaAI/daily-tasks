id: daily-tasks-plan-checkin-boundary-out-of-scope
name: Do not route check-in reconciliation to plan
description: Reconciling manual edits and reported progress across yesterday's plan belongs to check-in.
tags:
  - trigger
  - negative
inputs:
  prompt: "Resume my check-in, reconcile the manual checkbox edits I made to yesterday's plan, and resolve pending conflicts."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: plan-checkin-reconciliation-negative
    config:
      skill_path: skills/daily-tasks-plan/SKILL.md
      mode: negative
