id: daily-tasks-capture-in-scope
name: Extract possible work as a candidate
description: Extract a possible commitment from notes without treating it as accepted work.
tags:
  - trigger
  - positive
inputs:
  prompt: "From these meeting notes, capture possible tasks, deduplicate them against existing work, and ask me to accept any candidates before creation: Sam volunteered to email the vendor."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: capture-positive-trigger
    config:
      skill_path: skills/daily-tasks-capture/SKILL.md
      mode: positive
