name: daily-tasks-capture-eval
description: Fast local trigger checks for the Daily Tasks capture skill.
skill: daily-tasks-capture
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 10
  parallel: false
  executor: mock
  model: mock
metrics:
  - name: trigger_quality
    weight: 1.0
    threshold: 1.0
    description: Does the capture skill match candidate-extraction requests without matching unrelated summaries?
tasks:
  - "tasks/*.yaml"
