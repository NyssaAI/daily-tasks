name: daily-tasks-checkin-eval
description: Fast local trigger checks for reconciling progress and resuming a Daily Tasks check-in.
skill: daily-tasks-checkin
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 10
  parallel: false
  executor: mock
  model: mock
metrics:
  - name: trigger_quality
    weight: 1.0
    threshold: 1.0
    description: Does check-in match Daily Tasks recovery and reconciliation requests without matching ordinary hotel questions?
tasks:
  - "tasks/*.yaml"
