id: daily-tasks-router-in-scope
name: Route a Daily Tasks workflow
description: A request to combine task capture and daily planning belongs to the router.
tags:
  - trigger
  - positive
inputs:
  prompt: "I want to set up my Daily Tasks workspace, capture two possible commitments from this note, then plan today."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: router-positive-trigger
    config:
      skill_path: skills/daily-tasks/SKILL.md
      mode: positive
